apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: app
        image: /tmp/sirah-unikernels/test-kernel.img
        resources:
          limits:
            memory: "512Mi"
            cpu: "2"
